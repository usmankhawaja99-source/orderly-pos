<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>orderly — Fast POS Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #050507;
      --bg-panel: #0d0d11;
      --bg-tile: #131318;
      --bg-tile-hover: #191920;
      --fire-orange: #ff5500;
      --fire-glow: rgba(255, 85, 0, 0.28);
      --fire-subtle: rgba(255, 85, 0, 0.10);
      --border-dark: rgba(255, 255, 255, 0.08);
      --border-fire: #ff5500;
      --text-white: #ffffff;
      --text-gray: #9ca3af;
      --text-muted: #52525b;
      --danger: #ef4444;
      --radius-tile: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-black);
      color: var(--text-white);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* TOP BAR */
    header {
      height: 64px;
      padding: 0 24px;
      background: var(--bg-black);
      border-bottom: 1px solid var(--border-dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .logo-wordmark {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 26px;
      letter-spacing: -1.2px;
      color: var(--fire-orange);
      text-transform: lowercase;
      line-height: 1;
    }

    .nav-pills {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border-dark);
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-gray);
      font-family: inherit;
      font-weight: 600;
      font-size: 13px;
      padding: 7px 14px;
      border-radius: 9px;
      cursor: pointer;
    }

    .nav-btn.active {
      background: var(--fire-orange);
      color: #fff;
    }

    /* VIEWS CONTAINER */
    .view-container {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .view-section {
      display: none;
      width: 100%;
      height: 100%;
    }

    .view-section.active {
      display: flex;
    }

    /* VIEW 1: TABLE FLOOR PLAN */
    .floor-workspace {
      flex: 1;
      padding: 28px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .tables-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 18px;
    }

    .table-tile {
      aspect-ratio: 1 / 1;
      background: var(--bg-tile);
      border: 2px solid var(--border-dark);
      border-radius: var(--radius-tile);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .table-tile:hover { background: var(--bg-tile-hover); }
    .table-tile:active { transform: scale(0.96); }
    .table-tile.occupied { border-color: rgba(255, 85, 0, 0.4); }

    .tile-number {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1;
    }

    .tile-time {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-gray);
    }

    .tile-bill {
      font-size: 20px;
      font-weight: 800;
      color: var(--fire-orange);
    }

    /* VIEW 2: SINGLE-SCREEN ORDER & MODIFY WORKSPACE (PART 2) */
    .order-workspace {
      display: flex;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* LEFT: MENU CATEGORIES & ITEMS (< 3 CLICKS) */
    .menu-selection-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px 24px;
      gap: 16px;
      overflow: hidden;
      background: #070709;
    }

    .category-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .cat-btn {
      padding: 9px 18px;
      border-radius: 11px;
      background: var(--bg-tile);
      border: 1px solid var(--border-dark);
      color: var(--text-gray);
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    .cat-btn.active {
      background: var(--fire-subtle);
      border-color: var(--fire-orange);
      color: #fff;
    }

    .menu-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      grid-auto-rows: 120px;
      gap: 12px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .menu-card {
      background: var(--bg-tile);
      border: 1px solid var(--border-dark);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.15s ease;
    }

    .menu-card:active { transform: scale(0.96); }
    .menu-card:hover { border-color: var(--fire-orange); }

    .menu-card-title {
      font-weight: 700;
      font-size: 14px;
      line-height: 1.25;
    }

    .menu-card-price {
      font-weight: 800;
      font-size: 15px;
      color: var(--fire-orange);
    }

    /* RIGHT: LIVE TICKET & INLINE MODIFIER POPUP */
    .ticket-sidebar {
      width: 420px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border-dark);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .ticket-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ticket-items {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ticket-line {
      background: var(--bg-tile);
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      position: relative;
      transition: border-color 0.12s;
    }

    .ticket-line:hover { border-color: var(--border-fire); }

    .ticket-line-top {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 14px;
    }

    .ticket-mods {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .mod-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      background: rgba(255, 85, 0, 0.18);
      color: #ff9900;
    }

    /* INSTANT MODIFIER POPUP ON SAME SCREEN */
    .modifier-panel {
      padding: 14px 20px;
      background: rgba(255, 85, 0, 0.06);
      border-top: 1px solid var(--border-fire);
      border-bottom: 1px solid var(--border-dark);
    }

    .mod-panel-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--fire-orange);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .mod-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .mod-btn {
      padding: 7px 4px;
      border-radius: 8px;
      border: 1px solid var(--border-dark);
      background: var(--bg-tile);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .mod-btn:active { background: var(--fire-orange); }

    .ticket-footer {
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.4);
      border-top: 1px solid var(--border-dark);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-gray);
    }

    .grand-total {
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      padding-top: 6px;
      border-top: 1px solid var(--border-dark);
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--fire-orange);
      color: #fff;
      font-family: inherit;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <header>
    <div class="logo-wordmark">orderly</div>
    <div class="nav-pills">
      <button class="nav-btn active" id="nav-floor" onclick="switchView('floor')">🪑 Floor Tables</button>
      <button class="nav-btn" id="nav-order" onclick="switchView('order')">⚡ Active Order</button>
    </div>
    <div style="font-size: 13px; color: var(--text-gray); font-weight: 600;">Server: Usman</div>
  </header>

  <!-- WORKSPACE VIEWS -->
  <div class="view-container">

    <!-- VIEW 1: FLOOR TABLES -->
    <section id="view-floor" class="view-section active">
      <div class="floor-workspace">
        <div style="font-size: 16px; font-weight: 700; color: var(--text-gray);">Double-click any table to open order editor</div>
        <div class="tables-grid" id="tables-grid"></div>
      </div>
    </section>

    <!-- VIEW 2: SINGLE SCREEN ORDER WORKSPACE -->
    <section id="view-order" class="view-section">
      <div class="order-workspace">
        
        <!-- LEFT: CATEGORIES & MENU ITEMS (Under 3 Clicks) -->
        <div class="menu-selection-area">
          <div class="category-bar">
            <button class="cat-btn active" onclick="filterCategory('ALL', this)">All Items</button>
            <button class="cat-btn" onclick="filterCategory('Mains', this)">🔥 Mains</button>
            <button class="cat-btn" onclick="filterCategory('Wood-Fired', this)">🍕 Wood-Fired</button>
            <button class="cat-btn" onclick="filterCategory('Sides', this)">🍟 Sides</button>
            <button class="cat-btn" onclick="filterCategory('Drinks', this)">🍹 Drinks</button>
          </div>
          <div class="menu-grid" id="menu-grid"></div>
        </div>

        <!-- RIGHT: TICKET & INLINE MODIFIERS -->
        <aside class="ticket-sidebar">
          <div class="ticket-header">
            <div style="font-weight: 800; font-size: 16px;" id="current-table-label">Table 12</div>
            <button class="cat-btn" style="padding: 5px 10px; font-size: 11px;" onclick="switchView('floor')">← Back to Tables</button>
          </div>

          <!-- TICKET ITEMS -->
          <div class="ticket-items" id="ticket-items-list"></div>

          <!-- INSTANT MODIFIER PANEL (Double Click Item to Modify, Triple Click to Delete) -->
          <div class="modifier-panel">
            <div class="mod-panel-title">
              <span id="modifier-helper-text">⚡ Double-Click item to Modify | Triple-Click to Delete</span>
            </div>
            <div class="mod-grid">
              <button class="mod-btn" onclick="applyMod('No Onions')">No Onions</button>
              <button class="mod-btn" onclick="applyMod('Extra Jalapeño')">+ Jalapeño</button>
              <button class="mod-btn" onclick="applyMod('Feta Crust')">+ Feta Crust</button>
              <button class="mod-btn" onclick="applyMod('Sub GF Bun')">GF Bun</button>
              <button class="mod-btn" onclick="applyMod('No Aioli')">No Aioli</button>
              <button class="mod-btn" onclick="applyMod('Extra Crispy')">Extra Crispy</button>
            </div>
          </div>

          <!-- TICKET FOOTER -->
          <div class="ticket-footer">
            <div class="total-row mono">
              <span>Subtotal</span>
              <span id="subtotal-val">$0.00</span>
            </div>
            <div class="total-row mono">
              <span>Tax (8.25%)</span>
              <span id="tax-val">$0.00</span>
            </div>
            <div class="total-row grand-total mono">
              <span>Total Due</span>
              <span id="total-val" style="color: var(--fire-orange);">$0.00</span>
            </div>
            <button class="action-btn" onclick="sendOrderToKitchen()">🚀 Send to Kitchen & Print</button>
          </div>
        </aside>

      </div>
    </section>

  </div>

  <script>
    const MENU = [
      { id: 'm1', name: 'Double Fire Smash Burger', category: 'Mains', price: 15.50 },
      { id: 'm2', name: 'Hot Honey Pepperoni Pie', category: 'Wood-Fired', price: 19.00 },
      { id: 'm3', name: 'Spinach, Feta & Jalapeño Pie', category: 'Wood-Fired', price: 18.50 },
      { id: 'm4', name: 'Birria Crunch Tacos (3pc)', category: 'Mains', price: 16.00 },
      { id: 'm5', name: 'Charred Chicken Pesto Sub', category: 'Mains', price: 14.50 },
      { id: 'm6', name: 'Truffle Parm Fries', category: 'Sides', price: 8.00 },
      { id: 'm7', name: 'Blistered Shishito Peppers', category: 'Sides', price: 9.50 },
      { id: 'm8', name: 'Smoked Blood Orange Marg', category: 'Drinks', price: 13.00 },
      { id: 'm9', name: 'Yuzu Ginger Spritz', category: 'Drinks', price: 7.50 }
    ];

    let tables = [
      { id: 12, time: '42m', items: [
        { name: 'Spinach, Feta & Jalapeño Pie', price: 18.50, mods: ['Crispy crust'] },
        { name: 'Double Fire Smash Burger', price: 15.50, mods: ['No Onions'] }
      ]},
      { id: 14, time: '18m', items: [
        { name: 'Charred Chicken Pesto Sub', price: 14.50, mods: [] }
      ]},
      { id: 15, time: '1h 12m', items: [] },
      { id: 18, time: '9m', items: [] },
      { id: 21, time: '31m', items: [] },
      { id: 22, time: 'Open', items: [] }
    ];

    let activeTableId = 12;
    let activeCategory = 'ALL';
    let selectedLineIndex = null;
    
    // Click tracking for Double-Click (modify) and Triple-Click (delete)
    let clickCounts = {};
    let clickTimers = {};

    function renderTables() {
      const grid = document.getElementById('tables-grid');
      grid.innerHTML = tables.map(t => {
        const sub = t.items.reduce((acc, i) => acc + i.price, 0);
        const total = sub + (sub * 0.0825);
        const isOpen = t.items.length === 0;

        return `
          <div class="table-tile ${isOpen ? '' : 'occupied'}" ondblclick="openTableOrder(${t.id})">
            <div class="tile-number">${t.id}</div>
            <div class="tile-time">${isOpen ? 'Open Table' : t.time + ' seated'}</div>
            <div class="tile-bill mono">${isOpen ? '—' : '$' + total.toFixed(2)}</div>
          </div>
        `;
      }).join('');
    }

    function renderMenu() {
      const grid = document.getElementById('menu-grid');
      const filtered = MENU.filter(m => activeCategory === 'ALL' || m.category === activeCategory);
      
      grid.innerHTML = filtered.map(item => `
        <div class="menu-card" onclick="addMenuItem('${item.name}', ${item.price})">
          <div class="menu-card-title">${item.name}</div>
          <div class="menu-card-price mono">$${item.price.toFixed(2)}</div>
        </div>
      `).join('');
    }

    function renderTicket() {
      const table = tables.find(t => t.id === activeTableId);
      const list = document.getElementById('ticket-items-list');

      document.getElementById('current-table-label').textContent = `Table ${table.id} Order`;

      if (table.items.length === 0) {
        list.innerHTML = `<div style="text-align:center; color:var(--text-muted); margin-top:40px; font-size:13px;">Tap menu items on the left to add (< 3 clicks)</div>`;
        selectedLineIndex = null;
      } else {
        list.innerHTML = table.items.map((item, idx) => {
          const isSelected = idx === selectedLineIndex;
          return `
            <div class="ticket-line" style="${isSelected ? 'border-color:var(--fire-orange); background:rgba(255,85,0,0.08);' : ''}" onclick="handleTicketItemClick(${idx})">
              <div class="ticket-line-top">
                <span>${item.name}</span>
                <span class="mono">$${item.price.toFixed(2)}</span>
              </div>
              ${item.mods.length > 0 ? `
                <div class="ticket-mods">
                  ${item.mods.map(m => `<span class="mod-tag">${m}</span>`).join('')}
                </div>
              ` : ''}
            </div>
          `;
        }).join('');
      }

      updateTotals(table);
    }

    function addMenuItem(name, price) {
      const table = tables.find(t => t.id === activeTableId);
      table.items.push({ name, price, mods: [] });
      selectedLineIndex = table.items.length - 1;
      renderTicket();
    }

    // Handles Multi-Click logic: Single tap selects, Double click focuses modify, Triple click deletes
    function handleTicketItemClick(idx) {
      selectedLineIndex = idx;
      renderTicket();

      const now = Date.now();
      if (!clickCounts[idx]) clickCounts[idx] = 0;
      clickCounts[idx]++;

      if (clickTimers[idx]) clearTimeout(clickTimers[idx]);

      clickTimers[idx] = setTimeout(() => {
        const count = clickCounts[idx];
        clickCounts[idx] = 0;

        const table = tables.find(t => t.id === activeTableId);

        if (count >= 3) {
          // Triple-Click: Delete item instantly
          table.items.splice(idx, 1);
          selectedLineIndex = null;
          renderTicket();
        } else if (count === 2) {
          // Double-Click: Highlighted for modification
          document.getElementById('modifier-helper-text').textContent = `⚡ Modifying Item #${idx + 1} (Tap buttons below)`;
        }
      }, 280);
    }

    function applyMod(modName) {
      if (selectedLineIndex === null) return;
      const table = tables.find(t => t.id === activeTableId);
      const item = table.items[selectedLineIndex];
      if (item && !item.mods.includes(modName)) {
        item.mods.push(modName);
        renderTicket();
      }
    }

    function updateTotals(table) {
      const sub = table.items.reduce((acc, i) => acc + i.price, 0);
      const tax = sub * 0.0825;
      const total = sub + tax;

      document.getElementById('subtotal-val').textContent = `$${sub.toFixed(2)}`;
      document.getElementById('tax-val').textContent = `$${tax.toFixed(2)}`;
      document.getElementById('total-val').textContent = `$${total.toFixed(2)}`;
    }

    function filterCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMenu();
    }

    function openTableOrder(tableId) {
      activeTableId = tableId;
      switchView('order');
      renderMenu();
      renderTicket();
    }

    function switchView(viewName) {
      document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

      if (viewName === 'floor') {
        document.getElementById('view-floor').classList.add('active');
        document.getElementById('nav-floor').classList.add('active');
        renderTables();
      } else {
        document.getElementById('view-order').classList.add('active');
        document.getElementById('nav-order').classList.add('active');
        renderMenu();
        renderTicket();
      }
    }

    function sendOrderToKitchen() {
      alert('Order sent to Kitchen KDS successfully!');
      switchView('floor');
    }

    // Initialize
    renderTables();
  </script>
</body>
</html>
